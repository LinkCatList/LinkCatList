name: Обновить отсчёт

on:
  schedule:
    - cron: "1 21 * * *"   # 00:01 по Москве
  workflow_dispatch:        # можно запустить вручную во вкладке Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сгенерировать SVG
        run: python3 widget/generate.py
      - name: Закоммитить, если поменялось
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add widget/countdown.svg
          git diff --cached --quiet || git commit -m "До встречи с Алиной: обновить отсчёт"
          git push
